<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Patrick Hand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-image: url('background.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.page {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  position: relative;
  width: 24rem;
  height: 24rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.clipboard {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: 3rem 2rem;
}

.top-box {
  background-color: black;
  color: white;
  padding: 0.75rem 1rem;
  border-radius: 0.375rem;
  text-align: center;
}

.top-box h1 {
  font-size: 1.5rem;
  font-weight: bold;
}

.middle-box {
  flex: 1;
  margin-top: 1rem;
  background-color: rgba(255, 255, 255, 0.4);
  border-radius: 0.375rem;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 1.5rem 1rem;
  gap: 1rem;
}

.input-container {
  width: 100%;
}

.field label {
  display: block;
  margin-bottom: 0.4rem;
  color: black;
  font-size: 0.95rem;
}

input {
  width: 100%;
  padding: 0.6rem;
  border: 1px solid #ccc;
  border-radius: 0.3rem;
  font-size: 0.9rem;
  background-color: rgba(255, 255, 255, 0.8);
}

.button-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  margin-top: auto;
}

.back-btn {
  background: black;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 0.375rem;
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 600;
  width: 25%;
  text-align: center;
  cursor: pointer;
}

.submit-btn {
  background: black;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 0.375rem;
  font-size: 1.1rem;
  font-weight: 600;
  flex: 1;
  text-align: center;
  border: none;
  cursor: pointer;
}

.error {
  color: #dc3545;
  font-size: 0.7rem;
  margin-top: 0.3rem;
  display: none;
}

.error.show {
  display: block;
}

.loading {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.75);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.loading.show {
  display: flex;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #f3f3f3;
  border-top: 4px solid #000;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
