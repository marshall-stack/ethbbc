<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>bbc_eth67</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg" />
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Patrick Hand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-image: url('background.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.page {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  position: relative;
  width: 24rem;
  height: 24rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.clipboard {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: 3rem 2rem;
}

.top-box {
  background-color: black;
  color: white;
  padding: 0.75rem 1rem;
  border-radius: 0.375rem;
  text-align: center;
}

.top-box h1 {
  font-size: 1.5rem;
  font-weight: bold;
}

.middle-box {
  flex: 1;
  margin-top: 1rem;
  background-color: rgba(255, 255, 255, 0.4);
  border-radius: 0.375rem;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 1.5rem 1rem;
  gap: 1rem;
}

.input-container {
  width: 100%;
}

.field label {
  display: block;
  margin-bottom: 0.4rem;
  color: black;
  font-size: 0.95rem;
}

input {
  width: 100%;
  padding: 0.6rem;
  border: 1px solid #ccc;
  border-radius: 0.3rem;
  font-size: 0.9rem;
  background-color: rgba(255, 255, 255, 0.8);
}

.button-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  margin-top: auto;
}

.back-btn {
  background: black;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 0.375rem;
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 600;
  width: 25%;
  text-align: center;
  cursor: pointer;
}

.submit-btn {
  background: black;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 0.375rem;
  font-size: 1.1rem;
  font-weight: 600;
  flex: 1;
  text-align: center;
  border: none;
  cursor: pointer;
}

.error {
  color: #dc3545;
  font-size: 0.7rem;
  margin-top: 0.3rem;
  display: none;
}

.error.show {
  display: block;
}

.loading {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.75);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.loading.show {
  display: flex;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #f3f3f3;
  border-top: 4px solid #000;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
</div>

<div id="page1" class="page">
  <div class="container">
    <img src="clipboard.png" class="clipboard" />

    <div class="content">
      <div class="top-box">
        <h1>DROP YOUR WALLET</h1>
      </div>

      <div class="middle-box">
        <div class="input-container">
          <div class="field">
            <label>EVM WALLET ADDRESS *</label>
            <input type="text" id="wallet" placeholder="0xYoMamasAddyHere" />
            <div class="error" id="wallet-error"></div>
            <div class="error" id="wallet-exists-error"></div>
          </div>
        </div>

        <div class="button-container">
          <a href="tasks.html" class="back-btn">← Back</a>
          <button id="submitForm" class="submit-btn">SUBMIT</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
</script>

<script type="module">
  import { createClient } from '@supabase/supabase-js';
  
  const SUPABASE_URL = 'https://hfurlkyfxxarwogquqeq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmdXJsa3lmeHhhcndvZ3F1cWVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MTc0MzEsImV4cCI6MjA5MDQ5MzQzMX0.KanUrxM5g_xSsJHJbHOEk3xRDaRxB9mNTQowngl2Z_k';
  
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  const loadingDiv = document.getElementById('loading');
  
  function showLoading() { loadingDiv.classList.add('show'); }
  function hideLoading() { loadingDiv.classList.remove('show'); }
  
  function showError(elementId, message) {
    const errorDiv = document.getElementById(elementId);
    errorDiv.textContent = message;
    errorDiv.classList.add('show');
  }
  
  function hideError(elementId) {
    const errorDiv = document.getElementById(elementId);
    errorDiv.classList.remove('show');
  }
  
  function validateEVMAddress(address) {
    return /^0x[a-fA-F0-9]{40}$/.test(address);
  }
  
  async function checkWalletExists(wallet) {
    const { data, error } = await supabase
      .from('users')
      .select('wallet_address')
      .eq('wallet_address', wallet)
      .maybeSingle();
    
    if (error) {
      console.error('Error checking wallet:', error);
      return false;
    }
    return !!data;
  }
  
  function getFromSession() {
    const data = sessionStorage.getItem('registrationData');
    return data ? JSON.parse(data) : null;
  }
  
  document.getElementById('wallet').addEventListener('input', () => {
    hideError('wallet-error');
    hideError('wallet-exists-error');
  });
  
  document.getElementById('submitForm').addEventListener('click', async () => {
    const walletAddress = document.getElementById('wallet').value.trim();
    
    if (!validateEVMAddress(walletAddress)) {
      showError('wallet-error', 'Invalid EVM wallet address');
      return;
    }
    
    showLoading();
    const walletExists = await checkWalletExists(walletAddress);
    hideLoading();
    
    if (walletExists) {
      showError('wallet-exists-error', '❌ Wallet already registered!');
      return;
    }
    
    const sessionData = getFromSession();
    if (!sessionData) {
      alert('Session expired. Please start over.');
      window.location.href = 'index.html';
      return;
    }
    
    showLoading();
    
    try {
      const { error } = await supabase
        .from('users')
        .insert([{
          username: sessionData.username,
          invitee: sessionData.invitee || 'none',
          wallet_address: walletAddress,
          repost_link: sessionData.repostLink || '',
          comment_link: sessionData.commentLink || '',
          referral_source: sessionData.referralSource || 'direct',
          user_agent: navigator.userAgent
        }]);
      
      if (error) {
        if (error.code === '23505') {
          throw new Error('Username or wallet already exists');
        }
        throw new Error(error.message);
      }
      
      // Store username for referral link
      sessionStorage.setItem('registeredUser', sessionData.username);
      
      hideLoading();
      window.location.href = 'congrat.html';
      
    } catch (error) {
      hideLoading();
      alert(`Error: ${error.message}`);
    }
  });
</script>

</body>
</html>
