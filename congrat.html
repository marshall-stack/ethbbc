<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>bbc_eth67</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg" />
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Patrick Hand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-image: url('background.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.page {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  position: relative;
  width: 24rem;
  height: 24rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.clipboard {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: 2.5rem 2rem;
}

.middle-box {
  flex: 1;
  background-color: rgba(255, 255, 255, 0.8);
  border-radius: 0.375rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  height: 4rem;
  align-items: center;
  text-align: center;
  padding: 1.5rem 1rem;
  gap: 1rem;
}

.congrats-text {
  font-size: 1.4rem;
  font-weight: 600;
  color: black;
  line-height: 1.3;
}

.copy-btn {
  background: black;
  color: white;
  padding: 0.7rem 2rem;
  border-radius: 0.375rem;
  text-decoration: none;
  font-size: 1.15rem;
  font-weight: 600;
  width: 80%;
  text-align: center;
  margin-top: 1rem;
  cursor: pointer;
  border: none;
  font-family: inherit;
  display: inline-block;
}

.copy-btn:hover {
  opacity: 0.9;
}


.sub-text {
  font-size: 0.9rem;
  color: #333;
  margin-top: 0.5rem;
}
</style>
</head>

<body>

<div class="page">
  <div class="container">
    <img src="clipboard.png" class="clipboard" />

    <div class="content">
      <div class="middle-box">
        <div class="congrats-text">
          <p>CONGRATULATIONS</p>
          <p>this was a happy ending</p>
        </div>

        <p class="sub-text">Rub one out for your Friends,<br>let them know about this</p>
        
        <button id="copyLinkBtn" class="copy-btn">Copy Link</button>
        <p class="sub-text" style="font-size:0.75rem">Share this link to invite others</p>
      </div>
    </div>
  </div>
</div>

<script>
  function generateInviteLink() {
    const username = sessionStorage.getItem('registeredUser');
    if (username) {
      const cleanUsername = username.startsWith('@') ? username.substring(1) : username;
      return `${window.location.origin}${window.location.pathname.replace('congrat.html', 'index.html')}?ref=${cleanUsername}`;
    }
    return `${window.location.origin}${window.location.pathname.replace('congrat.html', 'index.html')}`;
  }
  
  document.getElementById('copyLinkBtn').addEventListener('click', async () => {
    const inviteLink = generateInviteLink();
    try {
      await navigator.clipboard.writeText(inviteLink);
      const btn = document.getElementById('copyLinkBtn');
      const originalText = btn.textContent;
      btn.textContent = 'Link copied!';
      setTimeout(() => {
        btn.textContent = originalText;
      }, 2000);
    } catch (err) {
      alert('Failed to copy link');
    }
  });
</script>

</body>
</html>
